<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixel Art + AI explorations</title>
  <meta name="description" content="A simple and beautiful tiled pixel art gallery showcasing Amiga, C64, CGA, EGA, and ZX Spectrum retro graphics.">
  
  <!-- Favicon / Meta -->
  <meta property="og:title" content="Random Artwork - Pixel Art Gallery">
  <meta property="og:description" content="Explore retro pixel artwork tiles from classic platforms.">
  <meta property="og:type" content="website">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&family=Silkscreen&display=swap" rel="stylesheet">
  
  <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="pixelated">
  <div class="container">
    
    <!-- Site Header -->
    <header class="site-header">
      <div class="brand">
        <span class="brand-icon">[PX]</span>
      </div>
      <h1 class="site-title">Random Artwork</h1>
      <p class="site-subtitle">Pixel Art & Retro Platform Graphics Gallery</p>
    </header>

    <!-- Main Navigation & Controls -->
    <nav class="controls-bar" aria-label="Gallery Controls">
      
      <!-- Filter Tabs -->
      <div class="filter-tabs" id="filterTabs">
        <button class="filter-btn active" data-category="all">
          All <span class="badge" id="count-all">0</span>
        </button>
        <button class="filter-btn" data-category="amiga">
          Amiga <span class="badge" id="count-amiga">0</span>
        </button>
        <button class="filter-btn" data-category="c64">
          Commodore 64 <span class="badge" id="count-c64">0</span>
        </button>
        <button class="filter-btn" data-category="cga">
          CGA <span class="badge" id="count-cga">0</span>
        </button>
        <button class="filter-btn" data-category="ega">
          EGA <span class="badge" id="count-ega">0</span>
        </button>
        <button class="filter-btn" data-category="zx">
          ZX Spectrum <span class="badge" id="count-zx">0</span>
        </button>
      </div>

      <!-- View Controls & Search -->
      <div class="view-controls">
        <div class="search-box">
          <svg class="search-icon" width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
          </svg>
          <input type="text" id="searchInput" class="search-input" placeholder="Search artwork..." aria-label="Search artwork">
        </div>

        <button id="pixelToggleBtn" class="control-btn active" title="Pixel Crisp Rendering (Nearest Neighbor)">
          <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"></path>
          </svg>
        </button>

        <div style="display: flex; gap: 0.25rem;">
          <button class="control-btn grid-density-btn" data-density="sm" title="Small Tiles">
            <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
              <path d="M1 2.5A1.5 1.5 0 0 1 2.5 1h3A1.5 1.5 0 0 1 7 2.5v3A1.5 1.5 0 0 1 5.5 7h-3A1.5 1.5 0 0 1 1 5.5v-3zm8 0A1.5 1.5 0 0 1 10.5 1h3A1.5 1.5 0 0 1 15 2.5v3A1.5 1.5 0 0 1 13.5 7h-3A1.5 1.5 0 0 1 9 5.5v-3zm-8 8A1.5 1.5 0 0 1 2.5 9h3A1.5 1.5 0 0 1 7 10.5v3A1.5 1.5 0 0 1 5.5 15h-3A1.5 1.5 0 0 1 1 13.5v-3zm8 0A1.5 1.5 0 0 1 10.5 9h3a1.5 1.5 0 0 1 1.5 1.5v3a1.5 1.5 0 0 1-1.5 1.5h-3A1.5 1.5 0 0 1 9 13.5v-3z"/>
            </svg>
          </button>
          <button class="control-btn grid-density-btn active" data-density="md" title="Medium Tiles">
            <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
              <path d="M1 2.5A1.5 1.5 0 0 1 2.5 1h11A1.5 1.5 0 0 1 15 2.5v3A1.5 1.5 0 0 1 13.5 7h-11A1.5 1.5 0 0 1 1 5.5v-3zm0 8A1.5 1.5 0 0 1 2.5 9h11a1.5 1.5 0 0 1 1.5 1.5v3a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 1 13.5v-3z"/>
            </svg>
          </button>
          <button class="control-btn grid-density-btn" data-density="lg" title="Large Tiles">
            <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
              <path d="M1 2.5A1.5 1.5 0 0 1 2.5 1h11A1.5 1.5 0 0 1 15 2.5v11a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 1 13.5v-11z"/>
            </svg>
          </button>
        </div>
      </div>
    </nav>

    <!-- Tiled Image Gallery Grid -->
    <main class="gallery-grid grid-md" id="galleryGrid">
      <!-- Generated via app.js -->
    </main>

  </div>

  <!-- Lightbox Modal -->
  <div class="modal" id="lightboxModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-content">
      
      <button class="modal-btn modal-close" id="modalClose" title="Close (Esc)">
        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>

      <button class="modal-btn modal-prev" id="modalPrev" title="Previous Image (Left Arrow)">
        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
        </svg>
      </button>

      <button class="modal-btn modal-next" id="modalNext" title="Next Image (Right Arrow)">
        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
        </svg>
      </button>

      <div class="modal-image-container">
        <img src="" alt="" class="modal-image" id="modalImage">
      </div>

      <div class="modal-details">
        <h2 class="modal-title" id="modalTitle">Artwork Title</h2>
        <div class="modal-meta">
          <span class="sys-tag" id="modalSystem">System</span>
          <span id="modalPath">path/to/image.png</span>
          <a id="modalDownload" href="#" download class="control-btn" style="padding: 0.25rem 0.6rem; font-size: 0.8rem; text-decoration: none; display: inline-flex; gap: 0.3rem; align-items: center;" title="Download image">
            <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
            </svg>
            Download
          </a>
        </div>
      </div>

    </div>
  </div>

  <!-- JavaScript App -->
  <script src="app.js"></script>
</body>
</html>
